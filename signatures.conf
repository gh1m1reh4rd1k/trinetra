# =============================================================================
# Shiv web platform/CMS detection signatures  (extended edition)
#
# This file drives the HTTP-response platform fingerprinting in control.cpp
# (extract_html_body_signals). It has nothing to do with the nmap-service-probes
# style probe file used by -sV (probe.cpp / AllProbes) -- that is a separate
# stage and is not affected by this file.
#
# Format:
#   - Comments start with '#'. Blank lines are ignored.
#   - Sections are marked with [section_name].
#   - Fields within a line are separated by '|'. Whitespace around each field
#     is trimmed UNLESS noted otherwise below.
#   - A rule's ARG field is NOT trimmed for most rule kinds, so never put
#     spaces around the '|' separators in [platform.*] rule lines.
#   - The same section may appear more than once; entries accumulate.
#
# If this file is missing or fails to parse, Shiv logs a warning and simply
# runs with platform/CMS detection disabled -- it will not crash the scan.
#
# LAYOUT OF THIS FILE
#   1. [jsglobals]            JS global names to look for in <script> blocks
#   2. [paths]                href substrings (only href="..." values)
#   3. [attrs]                HTML attribute / class substrings (whole body)
#   4. [platform.*]           scored rules, grouped:
#        A. CMS / e-commerce / site builders
#        B. Static-site & docs generators
#        C. JavaScript frameworks
#        D. Community / admin / DevOps applications
#        E. Server-side frameworks & languages
#        F. Web servers & app servers
#        G. CDN / WAF / hosting / edge infrastructure
#   5. [meta_hint_platforms]  names matched against <meta> generator-style tags
#   6. [suppress]             cross-platform implication rules
#   7. [identity_headers]     headers shown on the -sV version line
#
# DESIGN RULES USED FOR THE RULES BELOW (read before editing)
#   * Prefer body_contains / header_contains / field_any_nonempty over
#     path_contains. path_contains only sees href="..." values, so it misses
#     <script src=...> and <img src=...>; body_contains sees everything.
#   * A platform needs a total score > 1 to be reported, so single weak
#     signals (weight 1) never report on their own. Use weight 3 only for
#     strings that are essentially unique to that product.
#   * Platforms listed in [meta_hint_platforms] get +2 from the generator
#     tag. Give those platforms at least one structural rule that does NOT
#     simply echo the generator text, otherwise a fake generator tag could
#     "validate itself" and the TAMPER? check could never fire. Platforms
#     with weak structure (static-site generators) are matched through a
#     meta_generator_contains rule instead of a hint.
#   * Platform names here must exactly match the names in
#     [meta_hint_platforms] and [suppress] (case-insensitive for hints).
#   * Set-Cookie is a repeated header and Shiv keeps only the FIRST one in
#     raw_headers, so cookie rules are low-confidence corroboration only.
# =============================================================================


# -----------------------------------------------------------------------------
# [jsglobals]
# JavaScript global variable names to search for inside <script> blocks, as
# either "window.<name>" or "var <name>". One name per line. Matches are
# recorded as "window.<name>" and can be referenced from [platform.*] sections
# via jsglobal_eq. (Matching is a substring find, so "wp" also matches
# "window.wpApiSettings"; only exact-equality rules consume the result.)
# NOTE: script blocks longer than 8000 characters are not scanned.
# -----------------------------------------------------------------------------
