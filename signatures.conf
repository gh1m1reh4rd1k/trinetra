# =============================================================================
# Shiv web platform/CMS detection signatures
#
# This file drives the HTTP-response platform fingerprinting in control.cpp
# (extract_html_body_signals). It has nothing to do with the nmap-service-probes
# style probe file used by -sV (probe.cpp / AllProbes) -- that is a separate
# stage and is not affected by this file.
#
# Format:
#   - Comments start with '#'. Blank lines are ignored.
#   - Sections are marked with [section_name].
#   - Fields within a line are separated by '|'. Whitespace around each field
#     is trimmed UNLESS noted otherwise below.
#
# If this file is missing or fails to parse, Shiv logs a warning and simply
# runs with platform/CMS detection disabled -- it will not crash the scan.
# =============================================================================


# -----------------------------------------------------------------------------
# [jsglobals]
# JavaScript global variable names to search for inside <script> blocks, as
# either "window.<name>" or "var <name>". One name per line. Matches are
# recorded as "window.<name>" and can be referenced from [platform.*] sections
# via jsglobal_eq.
# -----------------------------------------------------------------------------
[jsglobals]
wordpress
wp
Drupal
Magento
Shopify
Wix
React
Vue
angular
_next
__NEXT_DATA__
__NUXT__
__INITIAL_STATE__
_wpemojiSettings
_wpUtilSettings
ajaxurl
wc_cart_params
ga
gtag
fbq


# -----------------------------------------------------------------------------
# [paths]
# needle|label
# 'needle' is a lowercase substring searched for inside href="..." attribute
# values. On match, an entry "[label] <original-case href value>" is recorded
# and can be referenced from [platform.*] sections via path_contains (matched
# against 'label', i.e. the bracketed part of the recorded entry).
# -----------------------------------------------------------------------------
[paths]
/wp-content/|/wp-content/
/wp-includes/|/wp-includes/
/wp-json/|/wp-json/
/wp-json|wp-json link
/sites/default/|/sites/default/
/skin/frontend/|/skin/frontend/
/media/|/media/
/pub/static/|/pub/static/
/_next/|/_next/
/_nuxt/|/_nuxt/
xmlrpc.php?rsd|xmlrpc.php?rsd
wlwmanifest.xml|wlwmanifest
/feed/|/feed/


# -----------------------------------------------------------------------------
# [attrs]
# attr|label
# 'attr' is a lowercase substring searched for anywhere in the HTML body
# (case-insensitively). On match, an entry "attr:<label>" is recorded into the
# same list as jsglobals matches, and can be referenced via jsglobal_eq using
# "attr:<label>" as the exact-match string.
#
# NOTE: leading/trailing spaces in 'attr' ARE significant and are preserved
# by the parser (only the label half is trimmed) -- e.g. " id=" intentionally
# requires a preceding space so it doesn't match inside other words.
#
# A blank label means "recognized but intentionally suppressed" (kept here so
# the substring is documented; it contributes nothing to detection).
# -----------------------------------------------------------------------------
[attrs]
ng-app=|ng-app
ng-controller=|ng-controller
ng-model=|ng-model
ng-repeat=|ng-repeat
ng-bind=|ng-bind
ng-init=|ng-init
ng-view=|ng-view
ng-if=|ng-if
ng-version=|ng-version
data-ng-app=|data-ng-app
x-ng-app=|x-ng-app
data-reactroot|data-reactroot
data-reactid|data-reactid
data-v-|data-v-*
v-if=|v-if
v-for=|v-for
v-model=|v-model
v-bind=|v-bind
v-on=|v-on
data-app=|data-app
data-version=|data-version
data-product=|data-product
data-framework=|data-framework
<span class=|span-class
 id=|
 name=|


# -----------------------------------------------------------------------------
# [platform.NAME]
# One section per platform/framework being scored. Each line is a rule:
#   kind|arg|weight
#
# kind is one of:
#   path_contains           arg = substring to find in any recorded path entry
#                            (matches the "[label] ..." entries from [paths]).
#                            NOTE: only scans href="..." attribute values --
#                            use body_contains below for src=, plain text, etc.
#   jsglobal_eq              arg = exact string to match against a recorded
#                            js-global/attr entry (e.g. "window.Drupal" or
#                            "attr:ng-app")
#   comment_contains         arg = substring to find in any HTML comment
#                            (real <!-- --> comments only -- use body_contains
#                            for visible text that looks comment-like)
#   meta_generator_contains  arg = substring to find in the <meta name=generator>
#                            header/tag value
#   field_any_nonempty       arg = comma-separated list of HTTP response header
#                            names, e.g. "X-Iinfo" or "x_iinfo" (underscores
#                            and hyphens are interchangeable). Matched directly
#                            against the response's raw headers -- ANY header
#                            can be referenced here with no code change.
#                            Bumps once if any listed header is present and
#                            non-empty.
#   body_contains            arg = substring to find anywhere in the
#                            lowercased response body (your arg is lowercased
#                            automatically). Use this for signals that live
#                            outside href="..." and HTML comments -- e.g.
#                            src="...", inline JSON, or plain visible text.
#   header_contains          arg = "Header=needle". Checks whether the named
#                            response header's VALUE contains 'needle'
#                            (case-insensitive on both sides). Unlike
#                            field_any_nonempty (presence-only -- bumps just
#                            because a header exists), this keys off what the
#                            header actually SAYS, e.g. a Server header that
#                            contains "openresty" or "nginx", or an
#                            X-Powered-By that contains "PHP". Example:
#                              header_contains|Server=openresty|3
#
# All matching rules for a platform sum their weights. A platform needs a
# total score > 1 to be reported (single weak signals are ignored).
#
# TAMPER DETECTION: control.cpp also compares the platform these rules find
# from structural evidence (paths/JS-globals/comments/body/headers) against
# whatever the page's own <meta name=generator> tag CLAIMS. A confident
# structural match (score >= 3) for a platform other than the one named in
# the generator tag, while the claimed platform has little/no structural
# backing of its own, is flagged on the version line as "TAMPER? ...". This
# catches the common WAF/honeypot trick of serving a fake generator tag to
# mislead scanners -- faking one meta tag is trivial, faking a whole
# platform's worth of paths/JS globals/body content is not. No signatures.conf
# changes are needed to benefit from this -- it runs automatically against
# whatever [platform.*] / [meta_hint_platforms] sections exist below.
# -----------------------------------------------------------------------------

[platform.WordPress]
path_contains|/wp-content/|3
path_contains|/wp-includes/|3
path_contains|wlwmanifest|3
path_contains|xmlrpc.php|3
path_contains|wp-json|2
jsglobal_eq|window.wp|2
jsglobal_eq|window.wordpress|2
jsglobal_eq|window._wpemojiSettings|2
jsglobal_eq|window._wpUtilSettings|2
jsglobal_eq|window.ajaxurl|2
jsglobal_eq|window.wc_cart_params|1
comment_contains|WordPress|2
comment_contains|wordpress|2
meta_generator_contains|WordPress|2

[platform.Drupal]
path_contains|/sites/default/|3
jsglobal_eq|window.Drupal|3
comment_contains|Drupal|2
comment_contains|drupal|2
meta_generator_contains|Drupal|2
field_any_nonempty|x_drupal_cache,x_drupal_dynamic_cache|2
field_any_nonempty|x_drupal|1
field_any_nonempty|x_ah_environment|2
field_any_nonempty|x_generator|1

[platform.Magento]
path_contains|/skin/frontend/|3
path_contains|/pub/static/|2
jsglobal_eq|window.Magento|3
comment_contains|Magento|2
meta_generator_contains|Magento|2
field_any_nonempty|x_magento_cache_debug|2

[platform.Shopify]
jsglobal_eq|window.Shopify|3
comment_contains|Shopify|2

[platform.Wix]
jsglobal_eq|window.Wix|3
comment_contains|Wix|2
comment_contains|wix.com|2

[platform.Next.js]
path_contains|/_next/|3
jsglobal_eq|window._next|3
jsglobal_eq|window.__NEXT_DATA__|3
comment_contains|Next.js|2

[platform.Nuxt.js]
path_contains|/_nuxt/|3
jsglobal_eq|window.__NUXT__|3

[platform.React]
jsglobal_eq|window.React|1
jsglobal_eq|attr:data-reactroot|3
jsglobal_eq|attr:data-reactid|3

[platform.Vue]
jsglobal_eq|window.Vue|1
jsglobal_eq|attr:data-v-*|3
jsglobal_eq|attr:v-if|2
jsglobal_eq|attr:v-for|2
jsglobal_eq|attr:v-model|2
jsglobal_eq|attr:v-bind|1
jsglobal_eq|attr:v-on|1

[platform.Angular]
jsglobal_eq|window.angular|2
jsglobal_eq|attr:ng-version|3
meta_generator_contains|Angular|2

[platform.AngularJS]
jsglobal_eq|attr:ng-app|3
jsglobal_eq|attr:data-ng-app|3
jsglobal_eq|attr:x-ng-app|3
jsglobal_eq|attr:ng-controller|2
jsglobal_eq|attr:ng-model|2
jsglobal_eq|attr:ng-repeat|2
jsglobal_eq|attr:ng-bind|1
jsglobal_eq|attr:ng-init|1
jsglobal_eq|attr:ng-view|1
jsglobal_eq|attr:ng-if|1


# -----------------------------------------------------------------------------
# [meta_hint_platforms]
# Platform names checked (case-insensitively) as substrings against
# meta_generator / meta_cms / meta_framework / meta_powered_by / meta_built_with.
# Weights are fixed in code: generator/cms/framework = 2, powered_by/built_with = 1.
# -----------------------------------------------------------------------------
[meta_hint_platforms]
WordPress
Drupal
Joomla
Magento
PrestaShop
Ghost
TYPO3
Shopify
Wix
Squarespace
OpenCart
Angular
AngularJS
React
Vue


# -----------------------------------------------------------------------------
# [suppress]
# Platform>=N|SuppressedPlatform
# If 'Platform' scored >= N, force 'SuppressedPlatform' score to 0 (avoids
# double-reporting a meta-framework's underlying library, e.g. Next.js implies
# React).
# -----------------------------------------------------------------------------
[suppress]
Next.js>=2|React
Nuxt.js>=2|Vue


# =============================================================================
# Imperva / Incapsula WAF Detection
#
# field_any_nonempty now checks the raw response headers directly (any
# header, not just a fixed pre-registered list), and body_contains checks
# the whole lowercased body -- not just href="..." attributes or HTML
# comments. So this block is fully self-contained: add/remove lines here to
# tune detection, no C++ changes required. Header names below use the
# underscore convention (x_iinfo == "X-Iinfo" header) purely by house style;
# hyphens work identically.
# =============================================================================

[jsglobals]
_Incapsula_Resource
Incapsula

[paths]
/_Incapsula_Resource|/Incapsula_Resource
/Incapsula_Resource|/Incapsula_Resource

[platform.Imperva]
path_contains|/_Incapsula_Resource|3
path_contains|/Incapsula_Resource|3
body_contains|_incapsula_resource|3
body_contains|incapsula incident id|3
comment_contains|Incapsula|3
comment_contains|incident_id|3
field_any_nonempty|x_iinfo|3
field_any_nonempty|x_incapsula_guest_token|2
field_any_nonempty|x_incapsula_tag|2
field_any_nonempty|x_incapsula_client_ip|1
field_any_nonempty|x_incapsula_device_id|1
field_any_nonempty|x_incapsula_browser_id|1
field_any_nonempty|x_incapsula_geo|1
field_any_nonempty|x_incapsula_severity|1
field_any_nonempty|x_incapsula_visibility|1
field_any_nonempty|x_incapsula_security|1
field_any_nonempty|x_cdn_incap_status|2
field_any_nonempty|x_cdn_incap_tls_version|1
field_any_nonempty|x_cdn_incap_reqid|2
field_any_nonempty|x_iinfo_privatestatus|1
meta_generator_contains|Incapsula|2
meta_generator_contains|Imperva|2

[meta_hint_platforms]
Imperva
Incapsula
Cloudflare
Akamai
Fastly
CloudFront

[suppress]
Imperva>=2|nginx
Imperva>=2|Apache
Cloudflare>=2|nginx
Cloudflare>=2|Apache
Akamai>=2|Apache
Sucuri>=2|Apache


# =============================================================================
# Additional CDN / WAF / edge-infra detection
#
# Same generic mechanism as the Imperva block above -- field_any_nonempty
# checks raw response headers directly, so anything found in a real response
# can be added here as a plain header name, no C++ changes needed.
# =============================================================================

[platform.Cloudflare]
field_any_nonempty|cf_ray,cloudflare_rayid|3
field_any_nonempty|cf_cache_status|2
field_any_nonempty|cf_railgun|2
field_any_nonempty|cf_mitigated|2

[platform.Akamai]
field_any_nonempty|x_akamai_transformed|3
field_any_nonempty|akamai_cache_key|2

[platform.Fastly]
field_any_nonempty|ghost_fastly|2

[platform.Sucuri]
field_any_nonempty|x_sucuri_id|3
field_any_nonempty|x_sucuri_cache|2

[platform.OpenResty]
# The real-world signal for OpenResty is almost always the Server header
# itself -- OpenResty is nginx + LuaJIT and by default reports itself as
# "Server: openresty" or "Server: openresty/1.21.4.1" (the version-bearing
# form is what also lets it show up on the version line via
# [identity_headers]'s existing "Server" row). The X-Openresty-* headers
# below are opt-in app-level headers some sites add themselves, so they're
# useful corroboration but far rarer than the Server header check.
header_contains|Server=openresty|3
field_any_nonempty|x_openresty_request_id|2
field_any_nonempty|x_openresty_cache,x_openresty_cache_store,x_openresty_cache_status|1
field_any_nonempty|x_openresty_cache_protocol|1

[platform.Nginx]
header_contains|Server=nginx|3
field_any_nonempty|x_accel_expires,x_accel_redirect|1

[platform.Apache]
header_contains|Server=apache|3

[platform.LiteSpeed]
header_contains|Server=litespeed|3
field_any_nonempty|x_litespeed_cache|2
field_any_nonempty|x_litespeed_cache_control|1

[platform.Caddy]
header_contains|Server=caddy|3

[platform.IIS]
header_contains|Server=microsoft-iis|3
field_any_nonempty|x_aspnet_version|2
field_any_nonempty|x_aspnetmvc_version|2
field_any_nonempty|x_powered_by_plesk|1

[platform.Tomcat]
header_contains|Server=apache-coyote|3
header_contains|Server=tomcat|3
comment_contains|Tomcat|2

[platform.NodeExpress]
header_contains|X-Powered-By=express|3

[platform.Kestrel]
header_contains|Server=kestrel|3

[platform.Gunicorn]
header_contains|Server=gunicorn|3

[platform.Werkzeug]
header_contains|Server=werkzeug|3

[platform.PHPBuiltinServer]
header_contains|Server=php|3

[platform.Varnish]
header_contains|Via=varnish|2
header_contains|Server=varnish|3
field_any_nonempty|x_varnish,x_varnish_cache|2

[platform.HAProxy]
header_contains|Server=haproxy|3
header_contains|Via=haproxy|2

[platform.Undertow]
header_contains|Server=undertow|3
header_contains|Server=wildfly|3

[platform.Jetty]
header_contains|Server=jetty|3

[platform.CowboyPhoenix]
header_contains|Server=cowboy|3

[platform.Envoy]
field_any_nonempty|x_envoy_upstream_service_time|3
header_contains|Server=envoy|3

[platform.BrightData]
field_any_nonempty|x_luminati_ip,x_brd_ip|3
field_any_nonempty|x_luminati_timeline,x_brd_timeline|1
field_any_nonempty|x_lpm_port|2

[meta_hint_platforms]
Sucuri
Envoy
OpenResty
nginx
Apache
LiteSpeed
Caddy
IIS
Tomcat
Kestrel
