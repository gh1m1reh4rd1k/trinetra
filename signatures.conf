jsglobal_eq|window.wc_cart_params|1
comment_contains|WordPress|2
comment_contains|wordpress|2
# [disabled: self-validating -- see TAMPER note below] meta_generator_contains|WordPress|2
# --- extended ---
path_contains|/wp-admin/|2
path_contains|/wp-login.php|2
# body_contains catches src= references that path_contains cannot see. Weight
# is deliberately low: another site can merely hot-link a WordPress image.
